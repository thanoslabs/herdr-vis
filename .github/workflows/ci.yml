name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          # Fail if an env file or a private key is committed (by file name, not content).
          found="$(git ls-files | grep -E '(^|/)\.env(\..*)?$|\.(pem|key)$' || true)"
          if [ -n "$found" ]; then
            echo "Error: sensitive files committed:"
            echo "$found"
            exit 1
          fi

      - name: Check for stray pictures
        run: |
          # Pictures live in a mod's art/ folder, or are the layout's preview.png
          # or battle.gif: anywhere else is a generator run into the wrong folder.
          found="$(git ls-files '*.png' '*.gif' | grep -v -E '^(mods/[^/]+/art/|preview\.png$|battle\.gif$)' || true)"
          if [ -n "$found" ]; then
            echo "Error: pictures outside a mod's art folder:"
            echo "$found" | head -20
            exit 1
          fi

      - name: Validate YAML and JSON files
        run: |
          status=0
          for f in $(git ls-files '*.yaml' '*.yml'); do
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" || { echo "Invalid YAML: $f"; status=1; }
          done
          for f in $(git ls-files '*.json'); do
            python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$f" || { echo "Invalid JSON: $f"; status=1; }
          done
          exit $status

      - name: Check scripts
        run: |
          sh -n install.sh
          python3 -m py_compile tools/*.py
          for f in mods/*/*.js; do
            node --input-type=module --check < "$f" || { echo "Syntax error: $f"; exit 1; }
          done

      - name: Check the art
        run: |
          # art/ holds exactly the files the generator writes, by path (folders and
          # all), and nothing else: no stray file, folder entry or link
          out="$(mktemp -d)"
          python3 tools/idle-rpg-sprites.py "$out" > /dev/null
          diff <(cd "$out" && find . ! -type d | LC_ALL=C sort) <(cd mods/idle-rpg/art && find . ! -type d | LC_ALL=C sort) \
            || { echo "art/ and the generator disagree: regenerate it"; exit 1; }
          diff <(cd "$out" && find . -type d | LC_ALL=C sort) <(cd mods/idle-rpg/art && find . -type d | LC_ALL=C sort) \
            || { echo "art/ has folders the generator does not write"; exit 1; }
          # and every picture the rules can ask for is there: each class in each
          # colourway, each weapon's layer for its class in every picture it has
          # and its attack's pictures facing each way, each hat's overlay for each
          # class (no hat, no overlay), every monster's pictures and every character
          # of the pixel font, each in every picture it has; plus every picture
          # main.js names outright
          node --input-type=module <<'EOF'
          import { existsSync, readFileSync } from "node:fs";
          import { ATTACK_PARTS, CLASSES, FRAMES, GLYPHS, GLYPH_COLOURS, KINDS, MONSTER_ART, WEAPON_FRAMES, attackArt, catalogue, glyphArt, hatArt, lookArt, monsterArt, weaponArt } from "./mods/idle-rpg/rules.js";
          const dir = "mods/idle-rpg";
          const unknown = KINDS.filter((k) => !MONSTER_ART[k]);
          if (unknown.length) {
            console.error(`Kinds with no MONSTER_ART: ${unknown.join(", ")}`);
            process.exit(1);
          }
          const paths = [
            ...CLASSES.flatMap((c) => [
              ...catalogue(c, "armour").flatMap((it) => FRAMES.map((f) => lookArt(c, it.id, f))),
              // a weapon's own pictures (never its class's default standing in for it), and
              // its attack's (the warrior's slash is its own hit, so it has no "hit")
              ...catalogue(c, "weapon").flatMap((it) => [
                ...WEAPON_FRAMES[c].map((f) => (weaponArt(c, it.id, f)?.startsWith(`weapons/${c}/${it.id}/`) ? weaponArt(c, it.id, f) : null)),
                ...ATTACK_PARTS.flatMap((part) => (c === "warrior" && part === "hit" ? [] : ["l", "r"].map((side) => attackArt(c, it.id, part, side)))),
              ]),
              ...catalogue(c, "hat").flatMap((it) => (hatArt(c, it.id) ? FRAMES.map((f) => hatArt(c, it.id, f)) : [])),
            ]),
            ...KINDS.flatMap((k) => MONSTER_ART[k].map((part) => monsterArt(k, part))),
            ...GLYPH_COLOURS.flatMap((c) => [...GLYPHS].map((ch) => glyphArt(c, ch))),
            // the quoted "<folder>/<name>.png" paths in main.js (src("scene/wall.png") and so on)
            ...[...readFileSync(`${dir}/main.js`, "utf8").matchAll(/"([a-z0-9-]+(?:\/[a-z0-9-]+)+\.png)"/g)].map((m) => m[1]),
          ];
          const main = readFileSync(`${dir}/main.js`, "utf8");
          // a monster's part named in main.js (layer("top"), monsterArt(kind, "roar/wave")) is one some kind has
          const parts = new Set(Object.values(MONSTER_ART).flat());
          const strange = [...main.matchAll(/(?:layer\(|monsterArt\([^,()]+,\s*)"([^"]+)"/g)].map((m) => m[1]).filter((part) => !parts.has(part));
          if (strange.length) {
            console.error(`Monster parts no kind has: ${strange.join(", ")}`);
            process.exit(1);
          }
          // and a path main.js builds (`light/${art}.png`) starts in a folder that is there
          const built = [...main.matchAll(/`([a-z0-9-]+(?:\/[a-z0-9-]+)*)\/[^`/]*\$\{[^`]*\.png`/g)].map((m) => m[1]);
          const lost = built.filter((folder) => !existsSync(`${dir}/art/${folder}`));
          if (lost.length) {
            console.error(`Paths built in folders art/ does not have: ${lost.join(", ")}`);
            process.exit(1);
          }
          const missing = paths.filter((p) => typeof p !== "string" || !existsSync(`${dir}/art/${p}`));
          if (missing.length) {
            console.error(`Missing art:\n${missing.join("\n")}`);
            process.exit(1);
          }
          console.log(`${new Set(paths).size} picture paths, ${built.length} built paths' folders checked`);
          EOF

      - name: Install into an empty Herdr home
        run: |
          home="$(mktemp -d)"
          HERDR_APP_HOME="$home" ./install.sh idle-rpg   # the name it used to take is still accepted
          test -f "$home/layouts/idle-rpg.json"
          test -f "$home/mods/idle-rpg/main.js"
          test -f "$home/mods/idle-rpg/rules.js"
          test -f "$home/mods/idle-rpg/art/scene/wall.png"
          diff -r mods/idle-rpg/art "$home/mods/idle-rpg/art"

      - name: Upgrade an install with stale art
        run: |
          # an older install: flat art files, a file Herdr wrote, and art/ holding a
          # link to something outside the mod, which must survive
          home="$(mktemp -d)"
          outside="$(mktemp -d)"
          touch "$outside/keep.png"
          mkdir -p "$home/mods/idle-rpg/art"
          touch "$home/mods/idle-rpg/art/wizard.png" "$home/mods/idle-rpg/art/glyph-white-1.png" "$home/mods/idle-rpg/jsconfig.json"
          ln -s "$outside" "$home/mods/idle-rpg/art/elsewhere"
          HERDR_APP_HOME="$home" ./install.sh
          diff -r mods/idle-rpg/art "$home/mods/idle-rpg/art"
          test -f "$home/mods/idle-rpg/jsconfig.json"
          test -f "$outside/keep.png"
          # re-running over a symlinked art/ replaces the link, not what it points to
          rm -rf "$home/mods/idle-rpg/art"
          ln -s "$outside" "$home/mods/idle-rpg/art"
          HERDR_APP_HOME="$home" ./install.sh
          test ! -L "$home/mods/idle-rpg/art"
          test -f "$outside/keep.png"
          diff -r mods/idle-rpg/art "$home/mods/idle-rpg/art"
