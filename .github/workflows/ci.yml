name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          # Fail if an env file or a private key is committed (by file name, not content).
          found="$(git ls-files | grep -E '(^|/)\.env(\..*)?$|\.(pem|key)$' || true)"
          if [ -n "$found" ]; then
            echo "Error: sensitive files committed:"
            echo "$found"
            exit 1
          fi

      - name: Validate YAML and JSON files
        run: |
          status=0
          for f in $(git ls-files '*.yaml' '*.yml'); do
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" || { echo "Invalid YAML: $f"; status=1; }
          done
          for f in $(git ls-files '*.json'); do
            python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$f" || { echo "Invalid JSON: $f"; status=1; }
          done
          exit $status

      - name: Check scripts
        run: |
          sh -n install.sh
          python3 -m py_compile tools/*.py
          for f in */mods/*/main.js; do
            node --input-type=module --check < "$f" || { echo "Syntax error: $f"; exit 1; }
          done

      - name: Install into an empty Herdr home
        run: |
          home="$(mktemp -d)"
          HERDR_APP_HOME="$home" ./install.sh raid-party
          test -f "$home/layouts/raid-party.json"
          test -f "$home/mods/raid-party/main.js"
