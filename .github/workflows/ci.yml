name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          # Fail if an env file or a private key is committed (by file name, not content).
          found="$(git ls-files | grep -E '(^|/)\.env(\..*)?$|\.(pem|key)$' || true)"
          if [ -n "$found" ]; then
            echo "Error: sensitive files committed:"
            echo "$found"
            exit 1
          fi

      - name: Validate YAML and JSON files
        run: |
          status=0
          for f in $(git ls-files '*.yaml' '*.yml'); do
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" || { echo "Invalid YAML: $f"; status=1; }
          done
          for f in $(git ls-files '*.json'); do
            python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$f" || { echo "Invalid JSON: $f"; status=1; }
          done
          exit $status

      - name: Check scripts
        run: |
          sh -n install.sh
          python3 -m py_compile tools/*.py
          for f in */mods/*/*.js; do
            node --input-type=module --check < "$f" || { echo "Syntax error: $f"; exit 1; }
          done

      - name: Check the art
        run: |
          # art/ holds exactly the files the generator writes, by name
          out="$(mktemp -d)"
          python3 tools/idle-rpg-sprites.py "$out" > /dev/null
          diff <(ls "$out") <(ls idle-rpg/mods/idle-rpg/art) || { echo "art/ and the generator disagree: regenerate it"; exit 1; }
          # and every picture the rules can ask for is there
          node --input-type=module <<'EOF'
          import { existsSync } from "node:fs";
          import { CLASSES, FRAMES, GLYPHS, GLYPH_COLOURS, catalogue, glyphArt, lookArt } from "./idle-rpg/mods/idle-rpg/rules.js";
          const missing = [
            ...CLASSES.flatMap((c) =>
              catalogue(c, "armour").flatMap((it) => FRAMES.map((f) => `idle-rpg/mods/idle-rpg/art/${lookArt(c, it.id)}${f}.png`)),
            ),
            // the pixel font: every character in every colour
            ...GLYPH_COLOURS.flatMap((c) => [...GLYPHS].map((ch) => `idle-rpg/mods/idle-rpg/art/${glyphArt(c, ch)}.png`)),
          ].filter((p) => !existsSync(p));
          if (missing.length) {
            console.error(`Missing art:\n${missing.join("\n")}`);
            process.exit(1);
          }
          EOF

      - name: Install into an empty Herdr home
        run: |
          home="$(mktemp -d)"
          HERDR_APP_HOME="$home" ./install.sh idle-rpg
          test -f "$home/layouts/idle-rpg.json"
          test -f "$home/mods/idle-rpg/main.js"
          test -f "$home/mods/idle-rpg/rules.js"
